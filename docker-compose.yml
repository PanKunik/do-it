services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      secrets:
        - gh_packages_token
    container_name: do-it-backend
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: do-it-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

secrets:
  gh_packages_token:
    file: .gh_packages_token