name: Build, test and build Docker Image

on:
  pull_request:
    branches:
      - master
    types: 
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Configure NuGet to use GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name "github" \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GHCR_PAT_READONLY }}" \
            --store-password-in-clear-text

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build solution
        run: |
          dotnet restore backend/DoIt.sln
          dotnet build backend/DoIt.sln --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: '**/bin/Release/**'

  api-unit-tests:
    runs-on: ubuntu-latest
    needs: api-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build
          path: ./

      - name: Run domain unit tests
        run: dotnet test backend/tests/DoIt.Domain.Unit.Tests --no-build --no-restore --configuration Release

  api-integration-tests:
    runs-on: ubuntu-latest
    needs: api-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build
          path: ./

      - name: Run integration tests
        run: dotnet test backend/tests/DoIt.Api.Integration.Tests --no-build --no-restore --configuration Release

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Install Vitest browser runner
        working-directory: frontend
        run: |
          npm install -D vitest @vitest/browser-playwright playwright
          npx playwright install chromium

      - name: Run Angular/Vitest unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=chromium

      - name: Build Angular frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: frontend/dist/do-it-frontend

  build-docker:
    runs-on: ubuntu-latest
    needs: [ api-unit-tests, api-integration-tests, frontend-build ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build
          path: ./frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Set up Docker cache
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build api Docker image
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          REPO=$(echo "${{github.actor}}" | tr '[:upper:]' '[:lower:]')

          docker buildx build \
            --secret id=gh_packages_token,env=GH_PACKAGES_TOKEN \
            -t ghcr.io/$REPO/doit-api:test-latest \
            -f docker/backend.Dockerfile \
            ./backend

      - name: Build frontend Docker image
        run: |
          REPO=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')

          docker buildx build \
            -t ghcr.io/$REPO/doit-frontend:test-latest \
            -f docker/frontend.Dockerfile \
            ./frontend